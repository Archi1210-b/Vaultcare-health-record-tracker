<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>VaultCare – Your health records, locked and yours</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f1f8f6;--sf:#fff;--ink:#12302e;--mut:#56706c;--ln:#d3e5e0;--ac:#0e7c6b;--acd:#0a5c50;--acl:#dff1ed;--warn:#b45309;--wl:#fdf0dc;--bad:#c62828;--bl:#fde7e7;--r:8px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1b1a;--sf:#142625;--ink:#e3f0ed;--mut:#8fb0aa;--ln:#26403d;--ac:#2fa38d;--acd:#7fdccb;--acl:#173a35;--warn:#f0b05a;--wl:#3a2c12;--bad:#ff8a80;--bl:#3d1b1b}}
*{box-sizing:border-box}html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{border-top:5px solid var(--ac);background:var(--bg);color:var(--ink);font:16px/1.55 'Instrument Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Newsreader',Georgia,serif;font-weight:600;line-height:1.12;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2.4rem,6vw,4.1rem)}h2{font-size:clamp(1.6rem,3.5vw,2.3rem)}h3{font-size:1.25rem}
p{margin:0 0 1em;max-width:62ch}a{color:var(--ac)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.btn{background:var(--ac);color:#fff;border:0;padding:.7em 1.25em;border-radius:var(--r);font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--acd)}.btn.g{background:transparent;color:var(--ink);border:1px solid var(--ln)}.btn.g:hover{background:var(--acl)}.btn.s{padding:.4em .8em;font-size:.88rem}.btn.d{background:var(--bl);color:var(--bad)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
nav.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--ln)}.card{box-shadow:0 1px 2px rgba(15,42,67,.06)}.idc{border-top:8px solid var(--bad)}.idh{font-weight:600;color:var(--bad);margin-bottom:6px}.chart{width:100%;height:auto}.s3{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}.s3 .card{padding:12px 14px}.s3 b{font:600 1.5rem 'Newsreader',serif;display:block}.vault code{color:#8fe3d1}.vault small{color:#9bc7bd}
.logo{font:600 1.35rem 'Newsreader',serif;display:flex;gap:.5em;align-items:center;color:var(--ink);text-decoration:none}
.logo svg{width:26px;height:26px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:48px 0 64px}
.hero .lead{font-size:1.15rem;color:var(--mut)}
.vault{background:#0a3d36;color:#e3f0ed;border-radius:18px;padding:22px;box-shadow:0 20px 50px -20px rgba(18,48,46,.5)}
.vault .row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff22;font-size:.92rem}
.vault .row:last-child{border:0}.vault code{color:#7fdccb;font-size:.8rem;word-break:break-all}
.vault small{color:#9bbdb7}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;padding:40px 0;border-top:1px solid var(--ln)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:40px 0 64px;counter-reset:s}
.steps div{counter-increment:s;border-top:3px solid var(--ac);padding-top:12px}
.steps div:before{content:counter(s);font:600 1.6rem 'Newsreader',serif;color:var(--ac)}
footer{border-top:1px solid var(--ln);padding:24px 0;color:var(--mut);font-size:.9rem}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:22px}
.auth{max-width:420px;margin:40px auto}
label{display:block;font-weight:500;font-size:.9rem;margin:14px 0 4px}
input,select,textarea{width:100%;padding:.65em .8em;border:1px solid var(--ln);border-radius:8px;background:var(--bg)}
textarea{min-height:110px;resize:vertical}
.err{background:var(--bl);color:var(--bad);padding:.6em .8em;border-radius:8px;margin-top:12px;font-size:.92rem}
.ok{background:var(--acl);color:var(--acd);padding:.6em .8em;border-radius:8px;margin-top:12px;font-size:.92rem}
.app{display:grid;grid-template-columns:220px 1fr;gap:28px;padding:10px 0 60px}
.side{display:flex;flex-direction:column;gap:4px;position:sticky;top:12px;align-self:start}
.side button{text-align:left;background:none;border:0;padding:.65em .9em;border-radius:8px;cursor:pointer;font-weight:500;color:var(--mut)}
.side button:hover{background:var(--acl)}.side button[aria-current=true]{background:var(--ac);color:#fff;font-weight:600}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.rec{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid var(--ln)}
.rec:last-child{border:0}.rec b{display:block}.meta{color:var(--mut);font-size:.88rem}
.tag{display:inline-block;background:var(--acl);color:var(--acd);border-radius:20px;padding:.1em .7em;font-size:.8rem;font-weight:600}
.tag.w{background:var(--wl);color:var(--warn)}
table{border-collapse:collapse;width:100%;font-size:.93rem}td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--ln)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px}.stat .card{flex:1;min-width:140px;padding:14px 18px}.stat b{font:600 1.8rem 'Newsreader',serif;display:block}
#qr{display:inline-block;padding:14px;background:#fff;border-radius:12px}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
.tw{overflow-x:auto}
@media(max-width:820px){.hero,.cols,.grid2{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}.app{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto;position:static}.side button{white-space:nowrap}}
@media(prefers-reduced-motion:no-preference){.btn{transition:background .15s}}
</style></head><body>
<div class="wrap"><nav class="top"><a class="logo" href="#" onclick="go('home');return false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/><path d="M12 9v6M9 12h6" stroke="#0e7c6b"/></svg>VaultCare</a><div id="navr"></div></nav>
<main id="v"></main>
<footer>VaultCare · Team Nexora · CSE3132 Software Engineering Lab. Prototype: data stays in this browser and is encrypted with AES-GCM; the “cloud” is simulated locally.</footer></div>
<script>
const $=s=>document.querySelector(s),V=$('#v');let S=null,view='home',recs=[],shareTimer=null;
const te=new TextEncoder(),td=new TextDecoder(),b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* storage */
let mem={};const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
let _db;const db=()=>_db||(_db=new Promise((res,rej)=>{try{const q=indexedDB.open('vaultcare',1);q.onupgradeneeded=()=>['records','cloud','shares'].forEach(n=>q.result.createObjectStore(n,{keyPath:'id'}));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}}));
const tx=async(st,m,f)=>{const d=await db();return new Promise((res,rej)=>{const r=f(d.transaction(st,m).objectStore(st));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})};
const put=(s,o)=>tx(s,'readwrite',x=>x.put(o)),all=s=>tx(s,'readonly',x=>x.getAll()),del=(s,i)=>tx(s,'readwrite',x=>x.delete(i)),get=(s,i)=>tx(s,'readonly',x=>x.get(i));
/* crypto */
const derive=async(pw,salt)=>{const k=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},true,['encrypt','decrypt'])};
const enc=async(key,o)=>{const iv=crypto.getRandomValues(new Uint8Array(12));return{iv:b64(iv),ct:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(o))))}};
const dec=async(key,e)=>JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(e.iv)},key,ub(e.ct))));
const users=()=>{try{return JSON.parse(ls.get('vc_users')||'{}')}catch(e){return{}}};
/* lab summariser */
function parseLabs(t){return t.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^([A-Za-z][A-Za-z0-9 ().%\/]*?)\s*[:=\-]?\s*(\d+\.?\d*)\s*([A-Za-zµ%\/\.\^0-9]*)\s*(?:\(?\s*(\d+\.?\d*)\s*[-–to]+\s*(\d+\.?\d*)\s*\)?)?$/);if(!m)return null;const v=+m[2],lo=m[4]?+m[4]:null,hi=m[5]?+m[5]:null;return{n:m[1].trim(),v,u:m[3],lo,hi,f:lo!=null&&v<lo?'Low':hi!=null&&v>hi?'High':lo!=null?'Normal':'–'}}).filter(Boolean)}
const sumTxt=l=>{if(!l.length)return'No lab values were added for this report.';const a=l.filter(x=>x.f==='Low'||x.f==='High');return a.length?`${l.length} values checked. ${a.length} outside range: `+a.map(x=>`${x.n} is ${x.f.toLowerCase()} (${x.v} ${x.u})`).join(', ')+'. Discuss with your doctor.':`${l.length} values checked. All within the reference ranges given.`};
/* nav + routing */
function go(v){view=v;clearInterval(shareTimer);render()}
function navr(){$('#navr').innerHTML=S?`<span class="meta">${esc(S.email)}</span> <button class="btn g s" onclick="logout()">Log out</button>`:`<button class="btn g s" onclick="go('login')">Log in</button> <button class="btn s" onclick="go('reg')">Create vault</button>`}
function logout(){S=null;recs=[];go('home')}
async function render(){navr();const f={home,login:()=>auth(0),reg:()=>auth(1),app:appv,doctor:doctor}[view];V.innerHTML='';await f();window.scrollTo(0,0)}
function home(){V.innerHTML=`<section class="hero"><div><h1>Every health record you have, in one vault only you can open.</h1><p class="lead">Upload lab reports and prescriptions, read them in plain language, and show a doctor exactly what they need with a QR code that expires on its own.</p><button class="btn" onclick="go('reg')">Create your vault</button> <button class="btn g" onclick="go('doctor')">I’m a doctor with a code</button></div>
<div class="vault" aria-label="What the server sees"><b>What a server stores</b><div class="row"><span>Blood test, 05 Sep</span><small>encrypted</small></div><code>kT9x+Qe0aV3…mZ2pL8==</code><div class="row"><span>Prescription, Dr. Sharma</span><small>encrypted</small></div><code>Hd71uRw4n0P…cB6s0A==</code><div class="row"><span>Who holds the key?</span><b>Only you</b></div></div></section>
<section class="cols"><div><h3>Emergency card</h3><p>Blood group, allergies and contacts in one place for first responders.</p></div><div><h3>Medicines and visits</h3><p>Keep doses and upcoming appointments next to your reports.</p></div><div><h3>Vitals trends</h3><p>Log blood pressure, glucose and weight and watch the trend over time.</p></div><div><h3>Encrypted before it leaves</h3><p>Files are locked in your browser with AES-256 using a key made from your password. We never see readable records.</p></div><div><h3>Backed up, never exposed</h3><p>An encrypted copy goes to cloud backup, so a lost or reset phone doesn’t mean lost reports.</p></div><div><h3>Shared for minutes, not forever</h3><p>A QR code opens chosen records for a set time. After that, the link is dead.</p></div></section>
<section><h2>How it works</h2><div class="steps"><div><b>Create a vault</b><p class="meta">Pick a strong password. It protects everything.</p></div><div><b>Upload reports</b><p class="meta">Add a scan or photo, plus lab values for a summary.</p></div><div><b>Back up</b><p class="meta">Save an encrypted copy to the cloud.</p></div><div><b>Share by QR</b><p class="meta">Choose records and a time limit. The doctor scans.</p></div></div></section>`}
function auth(reg){V.innerHTML=`<div class="card auth"><h2>${reg?'Create your vault':'Welcome back'}</h2><form id="af" onsubmit="return false">${reg?'<label for="nm">Full name</label><input id="nm" autocomplete="name">':''}<label for="em">Email</label><input id="em" type="email" autocomplete="email"><label for="pw">Password${reg?' (8+ characters)':''}</label><input id="pw" type="password" autocomplete="${reg?'new':'current'}-password">${reg?'<p class="meta" style="margin-top:10px">Your password can’t be reset. If you forget it, your records can’t be decrypted.</p>':''}<div id="msg"></div><p style="margin-top:16px"><button class="btn" id="ab">${reg?'Create vault':'Unlock vault'}</button></p></form><p class="meta">${reg?'Have a vault? <a href="#" onclick="go(\'login\');return false">Log in</a>':'New here? <a href="#" onclick="go(\'reg\');return false">Create a vault</a>'}</p></div>`;
$('#ab').onclick=async()=>{const em=$('#em').value.trim().toLowerCase(),pw=$('#pw').value,m=$('#msg'),U=users();const e=t=>m.innerHTML=`<div class="err" role="alert">${t}</div>`;
if(!/^\S+@\S+\.\S+$/.test(em))return e('Enter a valid email address.');if(pw.length<8)return e('Password must be at least 8 characters.');
$('#ab').disabled=true;try{if(reg){if(U[em])throw'An account with this email already exists. Log in instead.';const salt=crypto.getRandomValues(new Uint8Array(16)),key=await derive(pw,salt);U[em]={name:$('#nm').value||em,salt:b64(salt),chk:await enc(key,{ok:1})};ls.set('vc_users',JSON.stringify(U));S={email:em,key,name:U[em].name}}
else{const u=U[em];if(!u)throw'No vault found for this email.';const key=await derive(pw,ub(u.salt));try{await dec(key,u.chk)}catch(x){throw'Wrong password.'}S={email:em,key,name:u.name}}
await loadRecs();view='app';sub='records';render()}catch(x){e(typeof x==='string'?x:'Something went wrong: '+(x.message||x));$('#ab').disabled=false}}}
async function loadRecs(){const rows=(await all('records')).filter(r=>r.owner===S.email);recs=[];P={emerg:{},meds:[],appts:[],vitals:[]};for(const r of rows){try{const d=await dec(S.key,r);if(r.id.startsWith('profile:'))P={...P,...d};else recs.push({...d,id:r.id})}catch(e){}}recs.sort((a,b)=>b.date.localeCompare(a.date))}
let sub='records';
function appv(){const T=[['records','My records'],['upload','Upload'],['share','Share by QR'],['backup','Cloud backup'],['emerg','Emergency card'],['care','Medicines and visits'],['vitals','Vitals trends']];
V.innerHTML=`<div class="app"><div class="side" role="tablist">${T.map(t=>`<button role="tab" aria-current="${sub===t[0]}" onclick="sub='${t[0]}';render()">${t[1]}</button>`).join('')}<button onclick="go('doctor')">Doctor view</button></div><div id="pane"></div></div>`;({records:pRecords,upload:pUpload,share:pShare,backup:pBackup,emerg:pEmerg,care:pCare,vitals:pVitals})[sub]()}
let q='',cat='All';
function pRecords(){const cats=['All',...new Set(recs.map(r=>r.type))],list=recs.filter(r=>(cat==='All'||r.type===cat)&&(r.name+r.provider).toLowerCase().includes(q.toLowerCase())),flag=recs.filter(r=>r.labs.some(l=>l.f==='Low'||l.f==='High')).length;
$('#pane').innerHTML=`<h2>Hello, ${esc((S.name||'').split(' ')[0])}</h2><div class="stat"><div class="card"><b>${recs.length}</b><span class="meta">records in vault</span></div><div class="card"><b>${flag}</b><span class="meta">with values to review</span></div><div class="card"><b>${P.meds.length}</b><span class="meta">active medicines</span></div><div class="card"><b>${P.appts.filter(a=>a.d>=new Date().toISOString().slice(0,10)).length}</b><span class="meta">upcoming visits</span></div></div>
<div class="card"><div class="bar"><input id="sq" placeholder="Search by name or provider" value="${esc(q)}" style="max-width:280px" aria-label="Search records"><select id="sc" style="max-width:180px" aria-label="Category">${cats.map(c=>`<option ${c===cat?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
${list.length?list.map(r=>`<div class="rec"><div><b>${esc(r.name)}</b><span class="meta">${esc(r.type)} · ${esc(r.provider||'Provider not set')} · ${esc(r.date)}</span> ${r.labs.some(l=>l.f==='Low'||l.f==='High')?'<span class="tag w">Review</span>':r.labs.length?'<span class="tag">Normal</span>':''}</div><div><button class="btn g s" onclick="openRec('${r.id}')">Open</button> <button class="btn d s" onclick="delRec('${r.id}')">Delete</button></div></div>`).join(''):`<div class="empty">${recs.length?'No records match your search.':'Your vault is empty. Upload your first report.'}<p><button class="btn" onclick="sub='upload';render()">Upload a report</button></p></div>`}</div><div id="det"></div>`;
$('#sq').oninput=e=>{q=e.target.value;const p=e.target.selectionStart;pRecords();const n=$('#sq');n.focus();n.setSelectionRange(p,p)};$('#sc').onchange=e=>{cat=e.target.value;pRecords()}}
const detail=r=>`<div class="card" style="margin-top:16px"><h3>${esc(r.name)}</h3><p>${esc(r.summary)}</p>${r.labs.length?`<div class="tw"><table><tr><th>Test</th><th>Result</th><th>Range</th><th>Status</th></tr>${r.labs.map(l=>`<tr><td>${esc(l.n)}</td><td>${l.v} ${esc(l.u)}</td><td>${l.lo!=null?l.lo+'–'+l.hi:'–'}</td><td><span class="tag ${l.f==='Low'||l.f==='High'?'w':''}">${l.f}</span></td></tr>`).join('')}</table></div>`:''}${r.file?(r.ftype.startsWith('image')?`<p style="margin-top:14px"><img src="${r.file}" alt="Scanned ${esc(r.name)}" style="max-width:100%;border-radius:8px;border:1px solid var(--ln)"></p>`:`<p class="meta" style="margin-top:14px">Attached file: ${esc(r.fname)}</p>`):''}</div>`;
function openRec(id){$('#det').innerHTML=detail(recs.find(r=>r.id===id));$('#det').scrollIntoView({behavior:'smooth'})}
async function delRec(id){if(!confirm('Delete this record permanently?'))return;await del('records',id);recs=recs.filter(r=>r.id!==id);pRecords()}
function pUpload(){$('#pane').innerHTML=`<h2>Upload a report</h2><div class="card"><div class="grid2"><div><label for="un">Report name</label><input id="un" placeholder="e.g. Complete blood count"></div><div><label for="ut">Type</label><select id="ut"><option>Lab report</option><option>Prescription</option><option>Imaging</option><option>Discharge summary</option><option>Other</option></select></div><div><label for="up">Hospital or doctor</label><input id="up"></div><div><label for="ud">Report date</label><input id="ud" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div>
<label for="uf">Scan or photo (image or PDF, under 4 MB)</label><input id="uf" type="file" accept="image/*,application/pdf" capture="environment">
<label for="ul">Lab values (optional, one per line)</label><textarea id="ul" placeholder="Hemoglobin 11.2 g/dL (12-16)&#10;Fasting glucose 92 mg/dL (70-99)"></textarea><p class="meta">Text reading from scans (OCR) is planned for a later version, so type values in for now.</p><div id="um"></div><button class="btn" id="us">Encrypt and save</button></div>`;
$('#us').onclick=async()=>{const m=$('#um'),name=$('#un').value.trim();if(!name)return m.innerHTML='<div class="err" role="alert">Give the report a name.</div>';const f=$('#uf').files[0];if(f&&f.size>4e6)return m.innerHTML='<div class="err" role="alert">File is over 4 MB. Choose a smaller one.</div>';
const file=f?await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)}):null,labs=parseLabs($('#ul').value),rec={name,type:$('#ut').value,provider:$('#up').value.trim(),date:$('#ud').value,labs,summary:sumTxt(labs),file,fname:f?.name,ftype:f?.type||''},id=crypto.randomUUID();
await put('records',{id,owner:S.email,...await enc(S.key,rec)});recs.unshift({...rec,id});recs.sort((a,b)=>b.date.localeCompare(a.date));sub='records';render()}}
async function pBackup(){const cl=(await all('cloud')).filter(r=>r.owner===S.email);$('#pane').innerHTML=`<h2>Cloud backup</h2><div class="card"><p>Backups are the same encrypted data held in your vault. The cloud copy can’t be read without your password.</p><div class="stat"><div class="card"><b>${recs.length}</b><span class="meta">records on this device</span></div><div class="card"><b>${cl.length}</b><span class="meta">records in cloud backup</span></div></div><button class="btn" id="bb">Back up now</button> <button class="btn g" id="br">Restore from backup</button><div id="bm"></div><p class="meta" style="margin-top:14px">This prototype keeps the “cloud” in a separate encrypted store in this browser. A production build would use a cloud storage provider.</p></div>`;
$('#bb').onclick=async()=>{const rows=(await all('records')).filter(r=>r.owner===S.email);for(const r of rows)await put('cloud',r);$('#bm').innerHTML=`<div class="ok" role="status">Backed up ${rows.length} encrypted record(s).</div>`};
$('#br').onclick=async()=>{let n=0;for(const r of cl){if(!(await get('records',r.id))){await put('records',r);n++}}await loadRecs();$('#bm').innerHTML=`<div class="ok" role="status">Restored ${n} missing record(s).</div>`}}
function pShare(){$('#pane').innerHTML=`<h2>Share by QR</h2><div class="card">${recs.length?`<p>Pick what the doctor may see and for how long.</p>${recs.map(r=>`<label style="display:flex;gap:10px;align-items:center;margin:8px 0;font-weight:400"><input type="checkbox" class="sr" value="${r.id}" style="width:auto"> ${esc(r.name)} <span class="meta">${esc(r.date)}</span></label>`).join('')}<label for="sx">Expires after</label><select id="sx" style="max-width:200px"><option value="5">5 minutes</option><option value="10" selected>10 minutes</option><option value="30">30 minutes</option></select><p style="margin-top:16px"><button class="btn" id="sg">Generate QR code</button></p><div id="so"></div>`:'<div class="empty">Upload a record first, then you can share it.</div>'}</div>`;
if(recs.length)$('#sg').onclick=async()=>{const ids=[...document.querySelectorAll('.sr:checked')].map(x=>x.value);if(!ids.length)return $('#so').innerHTML='<div class="err" role="alert">Select at least one record.</div>';
const k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']),code=crypto.randomUUID().slice(0,8),exp=Date.now()+(+$('#sx').value)*6e4,body=await enc(k,recs.filter(r=>ids.includes(r.id)));await put('shares',{id:code,exp,...body});
const token=code+'.'+b64(await crypto.subtle.exportKey('raw',k)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
$('#so').innerHTML=`<div style="margin-top:18px"><div id="qr"></div><p class="meta">Expires in <b id="cd"></b>. The key is inside the code, so keep it private.</p><label for="tk">Code text (for testing the doctor view)</label><input id="tk" readonly value="${token}"><p style="margin-top:10px"><button class="btn g s" onclick="go('doctor')">Open doctor view</button> <button class="btn d s" id="rv">Revoke now</button></p></div>`;
new QRCode($('#qr'),{text:token,width:200,height:200});clearInterval(shareTimer);const tick=()=>{const s=Math.max(0,Math.round((exp-Date.now())/1e3));$('#cd')&&($('#cd').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0'));if(!s)clearInterval(shareTimer)};tick();shareTimer=setInterval(tick,1e3);
$('#rv').onclick=async()=>{await del('shares',code);clearInterval(shareTimer);$('#so').innerHTML='<div class="ok" role="status">Access revoked. The code no longer works.</div>'}}}
function doctor(){V.innerHTML=`<div class="card auth" style="max-width:720px"><h2>Doctor view</h2><p class="meta">No account needed. Scan the patient’s QR code with your camera and paste the text below.</p><label for="dc">Code from QR</label><input id="dc" placeholder="abcd1234.key…"><p style="margin-top:14px"><button class="btn" id="db">View records</button>${S?' <button class="btn g" onclick="go(\'app\')">Back to vault</button>':''}</p><div id="dm"></div></div>`;
$('#db').onclick=async()=>{const m=$('#dm'),t=$('#dc').value.trim(),e=x=>m.innerHTML=`<div class="err" role="alert">${x}</div>`;try{const[c,k]=t.split('.');const s=await get('shares',c);if(!s)return e('This code is invalid or has been revoked.');if(Date.now()>s.exp){await del('shares',c);return e('This code has expired. Ask the patient for a new one.')}
const key=await crypto.subtle.importKey('raw',ub(k.replace(/-/g,'+').replace(/_/g,'/')+'=='.slice(0,(4-k.length%4)%4)),'AES-GCM',false,['decrypt']),rs=await dec(key,s);m.innerHTML=`<div class="ok" role="status">Shared read-only. Expires at ${new Date(s.exp).toLocaleTimeString()}.</div>`+rs.map(detail).join('')}catch(x){e('This code could not be read. Check that you copied it completely.')}}}
let P={emerg:{},meds:[],appts:[],vitals:[]};const saveP=async()=>put('records',{id:'profile:'+S.email,owner:S.email,...await enc(S.key,P)});
async function rm(k,i){P[k].splice(i,1);await saveP();pCare()}
const FL=[['blood','Blood group'],['allergies','Allergies'],['conditions','Chronic conditions'],['contact','Emergency contact'],['phone','Contact phone']];
function pEmerg(){const e=P.emerg;$('#pane').innerHTML=`<h2>Emergency card</h2><div class="grid2"><div class="card">${FL.map(f=>`<label for="e_${f[0]}">${f[1]}</label><input id="e_${f[0]}" value="${esc(e[f[0]])}">`).join('')}<p style="margin-top:16px"><button class="btn" id="es">Save card</button></p><div id="em"></div></div><div class="card idc"><div class="idh">Medical emergency card</div><h3>${esc(S.name)}</h3>${FL.map(f=>`<p style="margin-bottom:.6em"><span class="meta">${f[1]}</span><br><b>${esc(e[f[0]])||'Not set'}</b></p>`).join('')}</div></div>`;
$('#es').onclick=async()=>{FL.forEach(f=>P.emerg[f[0]]=$('#e_'+f[0]).value.trim());await saveP();pEmerg();$('#em').innerHTML='<div class="ok" role="status">Emergency card saved and encrypted.</div>'}}
function pCare(){const t=new Date().toISOString().slice(0,10);$('#pane').innerHTML=`<h2>Medicines and visits</h2><div class="grid2"><div class="card"><h3>Medicines</h3>${P.meds.length?P.meds.map((m,i)=>`<div class="rec"><div><b>${esc(m.n)}</b><span class="meta">${esc(m.dose)} · ${esc(m.t)}</span></div><button class="btn d s" onclick="rm('meds',${i})">Remove</button></div>`).join(''):'<p class="meta">No medicines added yet.</p>'}<label for="mn">Medicine</label><input id="mn"><label for="md">Dose</label><input id="md" placeholder="500 mg, 1 tablet"><label for="mt">When to take</label><input id="mt" placeholder="8:00 am and 8:00 pm"><p style="margin-top:14px"><button class="btn" id="ma">Add medicine</button></p></div><div class="card"><h3>Appointments</h3>${P.appts.length?P.appts.map((a,i)=>`<div class="rec"><div><b>${esc(a.doc)}</b><span class="meta">${esc(a.d)} · ${esc(a.note)}</span> ${a.d===t?'<span class="tag w">Today</span>':a.d<t?'<span class="tag">Past</span>':''}</div><button class="btn d s" onclick="rm('appts',${i})">Remove</button></div>`).join(''):'<p class="meta">No appointments yet.</p>'}<label for="ad">Date</label><input id="ad" type="date" value="${t}"><label for="an">Doctor or clinic</label><input id="an"><label for="ao">Reason</label><input id="ao"><p style="margin-top:14px"><button class="btn" id="aa">Add appointment</button></p></div></div>`;
$('#ma').onclick=async()=>{const n=$('#mn').value.trim();if(!n)return $('#mn').focus();P.meds.push({n,dose:$('#md').value.trim(),t:$('#mt').value.trim()});await saveP();pCare()};
$('#aa').onclick=async()=>{const d=$('#an').value.trim();if(!d)return $('#an').focus();P.appts.push({d:$('#ad').value,doc:d,note:$('#ao').value.trim()});P.appts.sort((a,b)=>a.d.localeCompare(b.d));await saveP();pCare()}}
const VM={sys:['Systolic BP','mmHg',90,130],dia:['Diastolic BP','mmHg',60,85],hr:['Heart rate','bpm',60,100],glu:['Glucose','mg/dL',70,140],wt:['Weight','kg',0,999]};let vm='sys';
function pVitals(){const v=P.vitals,m=VM[vm],pts=v.filter(x=>x[vm]).sort((a,b)=>a.d.localeCompare(b.d)),W=600,H=200,desc=[...v].sort((a,b)=>b.d.localeCompare(a.d));let svg='<p class="empty">Log a reading to see the trend.</p>';
if(pts.length){const ys=pts.map(x=>+x[vm]),mn=Math.min(...ys),mx=Math.max(...ys),sp=(mx-mn)||1,xy=pts.map((x,i)=>[pts.length>1?30+i*(W-60)/(pts.length-1):W/2,H-40-(+x[vm]-mn)/sp*(H-80)]);svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${m[0]} trend"><polyline fill="none" style="stroke:var(--ac)" stroke-width="3" points="${xy.map(p=>p.join(',')).join(' ')}"/>${xy.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" style="fill:var(--ac)"/><text x="${p[0]}" y="${p[1]-10}" text-anchor="middle" font-size="12" style="fill:var(--ink)">${ys[i]}</text><text x="${p[0]}" y="${H-10}" text-anchor="middle" font-size="11" style="fill:var(--mut)">${pts[i].d.slice(5)}</text>`).join('')}</svg>`}
$('#pane').innerHTML=`<h2>Vitals trends</h2><div class="s3">${Object.keys(VM).map(k=>{const x=desc.find(r=>r[k]),b=VM[k],out=x&&(+x[k]<b[2]||+x[k]>b[3]);return`<div class="card"><b>${x?x[k]:'–'}</b><span class="meta">${b[0]} ${b[1]}</span> ${out?'<span class="tag w">Review</span>':''}</div>`}).join('')}</div><div class="card"><div class="bar"><h3 style="margin:0">${m[0]} over time</h3><select id="vs" style="max-width:200px" aria-label="Measure">${Object.keys(VM).map(k=>`<option value="${k}" ${k===vm?'selected':''}>${VM[k][0]}</option>`).join('')}</select></div>${svg}</div><div class="card" style="margin-top:16px"><h3>Add a reading</h3><div class="grid2"><div><label for="vd">Date</label><input id="vd" type="date" value="${new Date().toISOString().slice(0,10)}"></div>${Object.keys(VM).map(k=>`<div><label for="v_${k}">${VM[k][0]} (${VM[k][1]})</label><input id="v_${k}" type="number" step="any"></div>`).join('')}</div><div id="vmsg"></div><p style="margin-top:14px"><button class="btn" id="va">Save reading</button></p><p class="meta">Ranges shown are general adult guides, not medical advice.</p></div>`;
$('#vs').onchange=e=>{vm=e.target.value;pVitals()};
$('#va').onclick=async()=>{const r={d:$('#vd').value};let any=0;Object.keys(VM).forEach(k=>{const x=$('#v_'+k).value;if(x){r[k]=x;any=1}});if(!any)return $('#vmsg').innerHTML='<div class="err" role="alert">Enter at least one value.</div>';P.vitals.push(r);await saveP();pVitals()}}
render();
</script></body></html>
